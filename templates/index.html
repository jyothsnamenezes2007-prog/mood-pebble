<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Pebble Jar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <h1>🪨 Welcome, {{ username }}!</h1>
            <div class="nav-links">
                {% if role == 'admin' %}
                    <a href="/admin" class="btn-admin">Admin Panel</a>
                {% endif %}
                <a href="/logout" class="btn-logout">Log Out</a>
            </div>
        </header>

        <!-- Visual Jar Area -->
        <div class="jar-wrapper">
            <div class="jar" id="moodJar">
                <div class="jar-lid"></div>
                <div class="jar-glass" id="pebblesContainer">
                    <!-- Falling/dropped pebbles will accumulate here -->
                </div>
            </div>
        </div>

        <!-- Mood Input Form -->
        <div class="input-card">
            <h2>Drop a Mood Pebble</h2>
            <form id="pebbleForm">
                <input type="text" id="moodInput" placeholder="How are you feeling today?" required autocomplete="off">
                <button type="submit">Drop into the Jar</button>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
