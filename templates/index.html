<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Pebble Jar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <span style="font-size: 13px; color: #7f8c8d;">Logged in as: <strong>{{ username }}</strong></span>
            <div>
                {% if role == 'admin' %}
                    <a href="/admin"><button style="padding: 6px 12px; font-size: 13px; background-color: #e67e22; margin-right: 5px;">Admin Panel</button></a>
                {% endif %}
                <a href="/logout"><button style="padding: 6px 12px; font-size: 13px; background-color: #e74c3c;">Logout</button></a>
            </div>
        </div>

        <h1>🪨 Mood Pebble Jar</h1>
        <p class="subtitle">Drop a tiny positive thought into the digital jar.</p>
        
        <div class="input-section">
            <input type="text" id="pebbleInput" placeholder="Type a good vibe (max 100 chars)..." maxlength="100">
            <button id="dropBtn" onclick="dropPebble()">Drop Pebble</button>
            <p id="errorMsg" class="error"></p>
        </div>

        <div class="jar-section">
            <h2>Collected Pebbles</h2>
            <div id="pebblesList" class="pebbles-grid">
                <!-- Pebbles will load here -->
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
